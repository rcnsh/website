name: Build

# The full build, which CI cannot run: prerendering opens a remote connection
# for the `remote: true` R2 binding and reads .dev.vars, so it needs Cloudflare
# credentials and the Spotify/GitHub secrets. A pull request from a fork cannot
# have those, which is why this is a workflow of its own rather than a job in
# ci.yml.
#
# Weekly rather than per-push: what it catches is drift — an expired token, a
# provider that changed a response shape, a share card generator that stopped
# producing cards — and drift does not arrive with a commit. Which is precisely
# why finding out at `npm run deploy` is finding out too late.
#
# The same reasoning leaves a gap: a run that never happens reports nothing.
# GitHub disables scheduled workflows after 60 days without repository
# activity, silently, and a quiet repo is exactly when drift piles up. So the
# job pings a healthchecks.io check (HC_BUILD_URL, the check's ping URL) on
# start, success and failure; the check expects a ping every Sunday and alerts
# when one does not come. A manual run pings too: it is a real build either way.

on:
  workflow_dispatch:
  schedule:
    # Sunday, early. Nothing here is urgent.
    - cron: "0 6 * * 0"

# The build reads secrets but writes nothing back to the repository.
permissions:
  contents: read

jobs:
  build:
    # Forks have none of the secrets below, so a scheduled run there would only
    # ever be a red cross nobody can fix.
    if: github.repository == 'rcnsh/website'
    runs-on: ubuntu-latest

    steps:
      # The heartbeat steps all share the same shape. The secret sits in the
      # step's env rather than being interpolated into the script, and an unset
      # one skips the ping rather than failing: the heartbeat is optional, so it
      # is not in the check below. A step's own env is not visible to its `if:`,
      # which is why the test is in the script. continue-on-error, because a
      # healthchecks.io outage is not a reason to call the build broken.
      - name: Heartbeat (start)
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HC_BUILD_URL }}
        run: |
          [ -n "$HC_URL" ] || exit 0
          curl -fsS -m 10 --retry 5 -o /dev/null "$HC_URL/start"

      # Every step below is useless without these, and the way they fail
      # without them is a hundred lines of wrangler stack trace whose actual
      # cause — "the secret is not set" — is one clause in the middle of it.
      # An unset secret expands to the empty string rather than erroring, so
      # nothing else here can tell that case apart from a real failure.
      # Checked before the checkout so the run ends in seconds, not minutes.
      - name: Check the secrets exist
        env:
          DEV_VARS: ${{ secrets.DEV_VARS }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          for name in DEV_VARS CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}." \
                 "Add them under Settings -> Secrets and variables -> Actions." \
                 "DEV_VARS is the contents of a filled-in .dev.vars;" \
                 "the Cloudflare pair is an API token with Workers Scripts:Edit" \
                 "and R2:Read, plus the account id it belongs to."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The build reads these the same way local development does. Held in one
      # secret rather than six because it is one file, and because the list of
      # what goes in it is .dev.vars.example's business, not this workflow's.
      - name: Write .dev.vars
        run: printf '%s\n' "$DEV_VARS" > .dev.vars
        env:
          DEV_VARS: ${{ secrets.DEV_VARS }}

      - run: npm run build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Last, so it only fires once everything above has passed.
      - name: Heartbeat (success)
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HC_BUILD_URL }}
        run: |
          [ -n "$HC_URL" ] || exit 0
          curl -fsS -m 10 --retry 5 -o /dev/null "$HC_URL"

      # A failed build alerts now, rather than three hours later when the check
      # gives up waiting for the success ping.
      - name: Heartbeat (failure)
        if: failure()
        continue-on-error: true
        env:
          HC_URL: ${{ secrets.HC_BUILD_URL }}
        run: |
          [ -n "$HC_URL" ] || exit 0
          curl -fsS -m 10 --retry 5 -o /dev/null "$HC_URL/fail"
