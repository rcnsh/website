name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Generate Worker types
        run: npx wrangler types

      - name: Generate derived files
        run: npm run generate

      - run: npm run lint

      - run: npm test

      - name: Typecheck
        run: npx astro check
